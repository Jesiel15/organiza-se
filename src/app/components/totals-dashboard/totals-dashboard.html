<div class="container-total">
  <p-card header="Total despesas">
    <p class="despesas">R$ {{ formattedTotalExpenses }}</p>
  </p-card>

  <p-card header="Total receitas">
    <p class="receitas">R$ {{ totalRevenues | number : "1.2-2" }}</p>
  </p-card>

  <p-card header="Saldo">
    <p [ngClass]="{ positivo: saldo >= 0, negativo: saldo < 0 }">
      R$ {{ saldo | number : "1.2-2" }}
    </p>
  </p-card>
</div>
